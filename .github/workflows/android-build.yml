# GitHub Actions Workflow: FabMargin APK Builder
# Trigger: manuell (workflow_dispatch) ODER bei Push auf main
name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Schritt 1: Repository auschecken
      - name: Repository auschecken
        uses: actions/checkout@v4

      # Schritt 2: Java 17 (Temurin) einrichten
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Schritt 3: Node.js 18 einrichten
      - name: Node.js 18 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Schritt 4: NPM-Abhängigkeiten installieren (Capacitor + Dependencies)
      - name: NPM-Abhängigkeiten installieren
        run: npm install

      # Schritt 5: Capacitor Android-Projekt erstellen und synchronisieren
      - name: Capacitor Android-Projekt erstellen und synchronisieren
        run: |
          # Android-Ordner neu erstellen damit cap add android sauber läuft
          rm -rf android
          npx cap add android
          npx cap sync android

      # Schritt 6: Debug-APK mit Gradle bauen
      - name: Debug-APK bauen
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug

      # Schritt 7: APK als GitHub Actions Artifact hochladen (Aufbewahrung: 30 Tage)
      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: FabMargin-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
