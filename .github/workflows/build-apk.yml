name: Build FabMargin – APK & AAB

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies & sync Capacitor
        run: |
          npm install
          npx cap add android || echo "android already added"
          npx cap sync android

      # --- Keystore Setup (nur wenn GitHub Secrets gesetzt sind) ---
      - name: Decode Keystore
        if: ${{ env.KEYSTORE_FILE != '' }}
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: echo "$KEYSTORE_FILE" | base64 --decode > android/app/fabmargin-release.keystore

      # --- Release AAB (Play Store) ---
      - name: Build Release AAB
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: cd android && chmod +x ./gradlew && ./gradlew bundleRelease

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: FabMargin-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # --- Debug APK (zum Testen) ---
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FabMargin-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
